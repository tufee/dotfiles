[colors]
background = #1e1e2e
background-alt = #313244
foreground = #cdd6f4
primary = #89b4fa
secondary = #a6e3a1
alert = #f38ba8
disabled = #6c7086

[bar/main]
monitor = ${env:MONITOR}
width = 100%
height = 28
radius = 0
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 3
border-size = 0
padding-left = 1
padding-right = 1
module-margin = 1

font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "JetBrainsMono Nerd Font:size=12;2"

modules-left = i3
modules-center = date
modules-right = pulseaudio memory cpu wlan bluetooth powermenu

tray-position = right
tray-padding = 2
cursor-click = pointer
enable-ipc = true
wm-restack = i3
separator = %{F#6c7086} | %{F-}

; ------------------------------------------------------------
; Workspaces do i3 (numeros dos paineis)
; ------------------------------------------------------------
[module/i3]
type = internal/i3
index-sort = true
enable-click = true
enable-scroll = true
fuzzy-match = true
; Exibe os workspaces em todas as barras, inclusive quando o Polybar nao
; consegue associar um monitor ao output correspondente do i3.
pin-workspaces = false

format = <label-state>

label-focused = %index%
label-focused-background = ${colors.background-alt}
label-focused-foreground = ${colors.primary}
label-focused-underline = ${colors.primary}
label-focused-padding = 2

label-unfocused = %index%
label-unfocused-padding = 2

label-visible = %index%
label-visible-background = ${colors.background-alt}
label-visible-padding = 2

label-urgent = %index%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

; ------------------------------------------------------------
; Hora
; ------------------------------------------------------------
[module/date]
type = internal/date
interval = 1
date = %I:%M %p
label = %date%

; ------------------------------------------------------------
; Volume
; ------------------------------------------------------------
[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
format-volume-spacing = 2
label-volume = %percentage%%
format-muted = <label-muted>
label-muted =  muted
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 

; ------------------------------------------------------------
; RAM
; ------------------------------------------------------------
[module/memory]
type = internal/memory
interval = 2
format = <label>
label = RAM %percentage_used%%

; ------------------------------------------------------------
; CPU
; ------------------------------------------------------------
[module/cpu]
type = internal/cpu
interval = 2
format = <label>
label = CPU %percentage%%

; ------------------------------------------------------------
; Wifi
; ------------------------------------------------------------
[module/wlan]
type = internal/network
interface-type = wireless
interval = 3
format-connected = <label-connected>
label-connected =  %essid%
format-disconnected = <label-disconnected>
label-disconnected =  desconectado
click-left = ~/.config/polybar/wifi-menu.sh &

; ------------------------------------------------------------
; Bluetooth
; ------------------------------------------------------------
[module/bluetooth]
type = custom/script
exec = bash -c "if bluetoothctl show | grep -q 'Powered: yes'; then printf '\\uf293'; else printf '\\uf294'; fi"
interval = 5
click-left = bash -c "if bluetoothctl show | grep -q 'Powered: yes'; then bluetoothctl power off; else bluetoothctl power on; fi" &
click-right = blueman-manager &

; ------------------------------------------------------------
; Layout de teclado
; ------------------------------------------------------------
[module/xkeyboard]
type = internal/xkeyboard
format = <label-layout>
label-layout = %layout%
label-layout-foreground = ${colors.primary}

; ------------------------------------------------------------
; Menu de energia
; ------------------------------------------------------------
[module/powermenu]
type = custom/menu
format-spacing = 1
label-open = 
label-close = 
label-separator = |
menu-0-0 = Desligar
menu-0-0-exec = systemctl poweroff
menu-0-1 = Reiniciar
menu-0-1-exec = systemctl reboot
menu-0-2 = Sair do i3
menu-0-2-exec = i3-msg exit

; ------------------------------------------------------------
; Usuario
; ------------------------------------------------------------
[module/user]
type = custom/script
exec = whoami
interval = 3600

; ------------------------------------------------------------
; Barra para o(s) monitor(es) que NAO fica com a tray
; (herda tudo de bar/main, so desliga a tray)
; ------------------------------------------------------------
[bar/secondary]
inherit = bar/main
tray-position = none
